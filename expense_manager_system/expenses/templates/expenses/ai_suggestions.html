{% extends "base.html" %}
{% block content %}
<h2>AI Suggestions for Expense Management</h2>
<form method="post">
    {% csrf_token %}
    <div class="mb-3">
        <label for="user_input" class="form-label">Enter your query:</label>
        <textarea class="form-control" id="user_input" name="user_input" rows="3"></textarea>
    </div>
    <button type="submit" class="btn btn-primary">Get Suggestions</button>
</form>
{% if suggestions %}
<div class="mt-4">
    <h3>AI suggestions:</h3>
    <p>{{ suggestion }}</p>
</div>
{% endif %}
{% endblock %}
